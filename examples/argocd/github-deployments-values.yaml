# Argo CD notifications posting GitHub Deployments for badil previews:
# values for the argo-helm argo-cd chart.
#
# When a pinned preview service's Application is synced and Healthy at a
# revision (the PR head SHA), the notifications controller posts a deployment
# status `success` on the service repo at that revision, with environment_url
# set to the service's preview host. When the Application is Degraded at the
# pinned SHA, it posts `failure`; when its sync fails or its sync status is
# Unknown at that SHA (for example a chart that fails to render), it posts
# `error`. Both land on the deployment a `success` at that SHA would use. When
# the Application is deleted, it posts `inactive` on the deployment of the SHA
# badil last pinned (best effort). When badil unpins the service from a preview
# that survives, it posts `inactive` on the deployment of the last pinned SHA
# in the Application's sync history. Argo CD authenticates with its own GitHub
# App.
#
# Requires notifications-values.yaml (spin-up time) and must come after it on
# the command line. It repeats the spin-up subscription, because Helm replaces
# lists: the subscriptions below are the full list.
#
# Apply to your Argo CD release, passing the App credentials at install time
# (this file holds no secret):
#
#   helm upgrade argocd argo/argo-cd -n argocd --version <your installed argo-cd chart version> \
#     --reuse-values -f notifications-values.yaml -f github-deployments-values.yaml \
#     --set-string notifications.secret.items.github-appID="$ARGOCD_GITHUB_APP_ID" \
#     --set-string notifications.secret.items.github-installationID="$ARGOCD_GITHUB_INSTALLATION_ID" \
#     --set-file notifications.secret.items.github-privateKey=<path to the App's .pem>
#
# Argo CD installed without Helm: put the keys service.github,
# template.badil-preview-deployed, template.badil-preview-failed,
# template.badil-preview-errored, template.badil-preview-deleted,
# template.badil-preview-unpinned, trigger.on-preview-deployed,
# trigger.on-preview-degraded, trigger.on-preview-sync-error,
# trigger.on-preview-deleted, trigger.on-preview-unpinned and subscriptions
# (with both entries below) under `data` of the argocd-notifications-cm
# ConfigMap, and the github-appID, github-installationID and github-privateKey
# items in the argocd-notifications-secret Secret.
notifications:
  notifiers:
    service.github: |
      appID: $github-appID
      installationID: $github-installationID
      privateKey: $github-privateKey

  templates:
    template.badil-preview-deployed: |
      message: "{{ index .app.metadata.labels \"app.kubernetes.io/name\" }} healthy in preview {{ index .app.metadata.labels \"app.kubernetes.io/instance\" }}"
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        deployment:
          state: success
          environment: "preview-{{ index .app.metadata.labels \"app.kubernetes.io/instance\" }}-{{ index .app.metadata.labels \"app.kubernetes.io/name\" }}"
          # Use http:// when preview.tls: false.
          environmentURL: "{{ with index .app.metadata.annotations \"preview.badil.dev/host\" }}https://{{ . }}/{{ end }}"
          requiredContexts: []
          autoMerge: false
          transientEnvironment: false
    template.badil-preview-failed: |
      message: "{{ index .app.metadata.labels \"app.kubernetes.io/name\" }} degraded in preview {{ index .app.metadata.labels \"app.kubernetes.io/instance\" }}"
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.spec.source.targetRevision}}"
        deployment:
          state: failure
          environment: "preview-{{ index .app.metadata.labels \"app.kubernetes.io/instance\" }}-{{ index .app.metadata.labels \"app.kubernetes.io/name\" }}"
          # Use http:// when preview.tls: false.
          environmentURL: "{{ with index .app.metadata.annotations \"preview.badil.dev/host\" }}https://{{ . }}/{{ end }}"
          requiredContexts: []
          autoMerge: false
          transientEnvironment: false
    template.badil-preview-errored: |
      message: "{{ index .app.metadata.labels \"app.kubernetes.io/name\" }} failed to sync in preview {{ index .app.metadata.labels \"app.kubernetes.io/instance\" }}"
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.spec.source.targetRevision}}"
        deployment:
          state: error
          environment: "preview-{{ index .app.metadata.labels \"app.kubernetes.io/instance\" }}-{{ index .app.metadata.labels \"app.kubernetes.io/name\" }}"
          # Use http:// when preview.tls: false.
          environmentURL: "{{ with index .app.metadata.annotations \"preview.badil.dev/host\" }}https://{{ . }}/{{ end }}"
          requiredContexts: []
          autoMerge: false
          transientEnvironment: false
    template.badil-preview-deleted: |
      message: "preview {{ index .app.metadata.labels \"app.kubernetes.io/instance\" }} removed"
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.spec.source.targetRevision}}"
        deployment:
          state: inactive
          environment: "preview-{{ index .app.metadata.labels \"app.kubernetes.io/instance\" }}-{{ index .app.metadata.labels \"app.kubernetes.io/name\" }}"
          # Use http:// when preview.tls: false.
          environmentURL: "{{ with index .app.metadata.annotations \"preview.badil.dev/host\" }}https://{{ . }}/{{ end }}"
          requiredContexts: []
          autoMerge: false
          transientEnvironment: false
    # revisionPath: the revision of the last pinned entry of the sync history,
    # as trigger.on-preview-unpinned selects it.
    template.badil-preview-unpinned: |
      message: "{{ index .app.metadata.labels \"app.kubernetes.io/name\" }} unpinned from preview {{ index .app.metadata.labels \"app.kubernetes.io/instance\" }}"
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{ $pinned := \"\" }}{{ range .app.status.history }}{{ $rev := toString (dig \"revision\" \"\" .) }}{{ $target := toString (dig \"source\" \"targetRevision\" \"\" .) }}{{ if and (regexMatch \"^[0-9a-f]{40}$\" $rev) (regexMatch \"^[0-9a-f]{7,40}$\" $target) (hasPrefix $target $rev) }}{{ $pinned = $rev }}{{ end }}{{ end }}{{ $pinned }}"
        deployment:
          state: inactive
          environment: "preview-{{ index .app.metadata.labels \"app.kubernetes.io/instance\" }}-{{ index .app.metadata.labels \"app.kubernetes.io/name\" }}"
          # Use http:// when preview.tls: false.
          environmentURL: "{{ with index .app.metadata.annotations \"preview.badil.dev/host\" }}https://{{ . }}/{{ end }}"
          requiredContexts: []
          autoMerge: false
          transientEnvironment: false

  triggers:
    # Fires once per sync at the pinned SHA of a pinned service's Application:
    # oncePer is the synced revision and the id of the sync history's last
    # entry, so a re-pin at the same SHA posts success again once Argo CD syncs
    # it (the engine never clears a oncePer key), and so does any further
    # successful sync at that SHA, on the same deployment. A pin or re-pin that
    # runs no sync (rendered manifests unchanged) posts nothing. The
    # startsWith test waits for the sync at the pinned SHA: right after a
    # pin, operationState still describes the previous sync (main's SHA when
    # the service tracked main). startsWith keeps a short SHA sent to
    # /v1/deploy working. The last test waits for health computed after the
    # sync: Argo CD records the sync's end before it refreshes health, so
    # until then health still describes the pods from before the sync. It
    # holds once a status refresh is later than the sync's end (reconciledAt
    # > finishedAt), or health changed after the sync started
    # (lastTransitionTime > startedAt, as when the new pods turn Healthy).
    # All timestamps have one-second precision, and equal seconds count as
    # stale.
    trigger.on-preview-deployed: |
      - when: app.status?.operationState?.phase in ['Succeeded'] and app.status?.health?.status == 'Healthy' and app.metadata.annotations['preview.badil.dev/vcs.ref.revision'] != '' and app.status?.operationState?.syncResult?.revision startsWith app.metadata.annotations['preview.badil.dev/vcs.ref.revision'] and app.status?.operationState?.finishedAt != nil and app.status?.operationState?.startedAt != nil and ((app.status?.reconciledAt != nil and date(app.status.reconciledAt) > date(app.status.operationState.finishedAt)) or (app.status?.health?.lastTransitionTime != nil and date(app.status.health.lastTransitionTime) > date(app.status.operationState.startedAt)))
        oncePer: app.status?.operationState?.syncResult?.revision + '/' + string(last(app.status?.history ?? [])?.id)
        send: [badil-preview-deployed]
    # Fires once per pinned SHA when the Application is Degraded at that SHA
    # (for a Deployment, after its progressDeadlineSeconds). The sync guard
    # keeps the previous SHA's health from posting on the new SHA's deployment.
    # The revision annotation is tested first: a dependency Application has
    # it empty and may have spec.sources instead of spec.source, which the
    # other tests read.
    trigger.on-preview-degraded: |
      - when: app.metadata.annotations['preview.badil.dev/vcs.ref.revision'] != '' and app.status?.health?.status == 'Degraded' and app.status?.sync?.status == 'Synced' and app.status?.sync?.revision == app.spec.source.targetRevision
        oncePer: app.spec.source.targetRevision
        send: [badil-preview-failed]
    # Fires once per pinned SHA when the sync at that SHA ends in Error or
    # Failed, or the comparison at that SHA is Unknown (the chart fails to
    # render). One condition, so oncePer sends at most one `error` per SHA.
    # The revision annotation is tested first, as for on-preview-degraded.
    trigger.on-preview-sync-error: |
      - when: app.metadata.annotations['preview.badil.dev/vcs.ref.revision'] != '' and ((app.status?.operationState?.phase in ['Error', 'Failed'] and app.status?.operationState?.syncResult?.revision == app.spec.source.targetRevision) or (app.status?.sync?.status == 'Unknown' and app.status?.sync?.comparedTo?.source?.targetRevision == app.spec.source.targetRevision))
        oncePer: app.spec.source.targetRevision
        send: [badil-preview-errored]
    # Best effort: fires only if the controller sees the deletion before the
    # Application's finalizer completes.
    trigger.on-preview-deleted: |
      - when: app.metadata.deletionTimestamp != nil and app.metadata.annotations['preview.badil.dev/vcs.ref.revision'] != ''
        oncePer: app.metadata.name
        send: [badil-preview-deleted]
    # Fires once per pinned sync that badil unpins (empty revision
    # annotation), when the sync history still holds a pinned entry:
    # a single-source entry whose revision is a full SHA, whose
    # source.targetRevision is a SHA, and a prefix of it. Branch-tracking
    # entries and dependency entries (chart versions; multi-source entries
    # with an empty source and no revision) are not pinned entries, and the
    # nil tests keep matches and startsWith off missing fields. It does not
    # wait for the sync to the branch: the pinned entry is already there.
    # oncePer is the last pinned entry's revision and history id, so a re-pin
    # at the same SHA followed by another unpin posts inactive again.
    trigger.on-preview-unpinned: |
      - when: app.metadata.annotations['preview.badil.dev/vcs.ref.revision'] == '' and any(app.status?.history ?? [], {.revision != nil and .source?.targetRevision != nil and .revision matches '^[0-9a-f]{40}$' and .source?.targetRevision matches '^[0-9a-f]{7,40}$' and .revision startsWith .source?.targetRevision})
        oncePer: let p = findLast(app.status?.history ?? [], {.revision != nil and .source?.targetRevision != nil and .revision matches '^[0-9a-f]{40}$' and .source?.targetRevision matches '^[0-9a-f]{7,40}$' and .revision startsWith .source?.targetRevision}); p?.revision + '/' + string(p?.id)
        send: [badil-preview-unpinned]

  # Full list: repeats the status subscription from notifications-values.yaml.
  subscriptions:
    - recipients:
        - badil
      triggers:
        - on-status-progressing
        - on-status-ready
        - on-status-degraded
        - on-status-sync-failed
      selector: app.kubernetes.io/part-of=preview-environments,app.kubernetes.io/managed-by=argocd
    - recipients:
        - github
      triggers:
        - on-preview-deployed
        - on-preview-deleted
        - on-preview-degraded
        - on-preview-sync-error
        - on-preview-unpinned
      selector: app.kubernetes.io/part-of=preview-environments,app.kubernetes.io/managed-by=argocd
