# Expected results of the triggers in ../../notifications-values.yaml and
# ../../github-deployments-values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feature-x-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: feature-x
  annotations:
    preview.badil.dev/vcs.ref.revision: ""
    test.badil.dev/on-preview-deployed: "false"
    test.badil.dev/on-preview-degraded: "false"
    test.badil.dev/on-preview-sync-error: "false"
    test.badil.dev/on-preview-unpinned: "false"
    test.badil.dev/on-preview-healthy: "false"
spec:
  project: feature-x
  source:
    repoURL: https://github.com/acme/api.git
    targetRevision: "main"
    path: k8s/
status:
  health: {status: Degraded}
  sync: {status: Synced, revision: main, comparedTo: {source: {targetRevision: main}}}
  operationState: {phase: Failed, syncResult: {revision: main}}
