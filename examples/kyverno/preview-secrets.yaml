# Registry pull Secret and app Secret in every preview with Kyverno: copies of
# the Secrets registry-pull and app-env from the namespace badil-secrets,
# generated in every preview namespace (label badil.dev/preview, set by the
# preview-apps chart). Existing previews get them when the policy is applied;
# teardown deletes them with the preview namespace.
#
# - Requires Kyverno v1.19.0 or later.
# - The names are examples to adapt: the source namespace badil-secrets and the
#   Secrets registry-pull and app-env. Create the sources before applying.
# - Kyverno's background controller creates the copies. The ClusterRole below
#   gives it read and write on every Secret in the cluster, through the label
#   rbac.kyverno.io/aggregate-to-background-controller: "true".
# - The copies stay in sync with the sources: editing a source updates its
#   copies, deleting a source deletes them.
# - Deleting the policy keeps the copies.
#
# Apply: kubectl apply -f preview-secrets.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: badil-kyverno-preview-secrets
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: badil-preview-secrets
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: preview-namespace
      expression: object.metadata.?labels[?"badil.dev/preview"].hasValue()
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: pullSecret
      expression: resource.Get("v1", "secrets", "badil-secrets", "registry-pull")
    - name: appSecret
      expression: resource.Get("v1", "secrets", "badil-secrets", "app-env")
  generate:
    - expression: generator.Apply(variables.nsName, [variables.pullSecret, variables.appSecret])
