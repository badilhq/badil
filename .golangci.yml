version: "2"

issues:
  max-same-issues: 50

formatters:
  enable:
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/badilhq/badil
    golines:
      max-len: 120

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - iface
    - ineffassign
    - intrange
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 30
      package-average: 10.0
    depguard:
      rules:
        non-test files:
          files: ["!$test"]
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead
        non-main files:
          files: ["!**/main.go"]
          deny:
            - pkg: log$
              desc: Use log/slog instead
        domain:
          list-mode: strict
          files:
            - "**/internal/preview/*.go"
            - "**/internal/catalog/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/bmatcuk/doublestar/v4"
            - "github.com/invopop/jsonschema"
            - "gopkg.in/yaml.v3"
            - "github.com/badilhq/badil/internal/catalog$"
            - "github.com/badilhq/badil/internal/preview$"
        use cases:
          list-mode: strict
          files:
            - "**/internal/forge/*.go"
            - "**/internal/lifecycle/*.go"
            - "**/internal/app/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/bmatcuk/doublestar/v4"
            - "github.com/invopop/jsonschema"
            - "gopkg.in/yaml.v3"
            - "github.com/badilhq/badil/internal/catalog$"
            - "github.com/badilhq/badil/internal/preview$"
            - "github.com/badilhq/badil/internal/app$"
            - "github.com/badilhq/badil/internal/forge$"
            - "github.com/badilhq/badil/internal/lifecycle$"
        store adapter:
          list-mode: lax
          files:
            - "**/internal/store/*.go"
            - "**/internal/store/**/*.go"
            - "!$test"
          deny:
            - pkg: "github.com/badilhq/badil/internal/forge/github$"
              desc: adapters import only domain, use cases and the adapters docs/ARCHITECTURE.md allows
            - pkg: "github.com/badilhq/badil/internal/forge/github/githubtest$"
              desc: adapters import only domain, use cases and the adapters docs/ARCHITECTURE.md allows
            - pkg: "github.com/badilhq/badil/internal/github$"
