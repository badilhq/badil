name: Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "examples/**"
      - "internal/preview/testdata/**"
      - "ct.yaml"
      - ".github/workflows/charts.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: helm lint
        run: for c in charts/*/; do helm lint "$c" -f "$c/ci/test-values.yaml"; done

      - name: ct lint (all charts)
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/helmpack/chart-testing:v3.15.0 \
            sh -c 'git config --global --add safe.directory /w && ct lint --config ct.yaml --all'

      - name: ct lint (version bump on changed charts)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/helmpack/chart-testing:v3.15.0 \
            sh -c 'git config --global --add safe.directory /w && ct lint --config ct.yaml --excluded-charts badil'

      - name: Render app with envFrom and initContainers
        run: |
          deploy=$(helm template backend-1 charts/app -f charts/app/ci/test-values.yaml | yq -N 'select(.kind == "Deployment")')
          got=$(echo "$deploy" | yq -N '.spec.template.spec.initContainers[] | select(.name == "acme-init") | .image')
          if [ "$got" != 'ghcr.io/acme/backend-1:latest' ]; then
            echo '::error::expected init container acme-init to render image ghcr.io/acme/backend-1:latest through tpl'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(echo "$deploy" | yq -N '.spec.template.spec.containers[0].envFrom[0].secretRef.name')
          if [ "$got" != 'acme-db' ]; then
            echo '::error::expected envFrom[0].secretRef.name "acme-db" on the main container'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(echo "$deploy" | yq -N '[.spec.template.spec.initContainers[] | select(.name == "pg-setup" or .name == "migrate")] | length')
          if [ "$got" != '0' ]; then
            echo '::error::expected no pg-setup or migrate init containers'
            exit 1
          fi

      - name: Render preview-env with badil values
        run: |
          out=$(helm template preview-x charts/preview-env -f internal/preview/testdata/values.golden.yaml)
          echo "$out" | grep -q 'preview.badil.dev/pr-url'

      - name: Render preview-env with YAML 1.1 ambiguous metadata
        run: |
          out=$(helm template preview-x charts/preview-env -f - <<'EOF'
          apiVersion: badil.dev/v1
          services:
            - name: backend-1
              repoURL: https://github.com/acme/backend-1.git
              branch: main
              commitSha: abc123
              metadata:
                pr-author: "Y"
                pr-url: https://github.com/acme/backend-1/pull/42
                pr-number: "0x1F"
                created-at: "2026-05-26"
                updated-at: "2026-05-26T10:00:00Z"
                vcs.ref.name: "on"
                cicd.pipeline.run.url: https://github.com/acme/backend-1/actions/runs/1
          EOF
          )
          got=$(echo "$out" | yq -N 'select(.kind == "Application") | .metadata.annotations | (.["preview.badil.dev/pr-author"], .["preview.badil.dev/pr-number"], .["preview.badil.dev/created-at"], .["preview.badil.dev/vcs.ref.name"])')
          want='Y
          0x1F
          2026-05-26
          on'
          if [ "$got" != "$want" ]; then
            echo "::error::metadata annotations do not match the original strings"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render preview-env with badil-written hosts
        run: |
          out=$(helm template feature-pricing charts/preview-env -f - <<'EOF'
          apiVersion: badil.dev/v1
          services:
            - name: backend-1
              repoURL: https://github.com/acme/backend-1.git
              branch: main
              commitSha: abc123
              host: backend-1-feature-pricing.127.0.0.1.nip.io
              metadata:
                pr-author: octocat
                pr-url: https://github.com/acme/backend-1/pull/42
                pr-number: "42"
                created-at: "2026-05-26T10:00:00Z"
                updated-at: "2026-05-26T10:00:00Z"
                vcs.ref.name: feature/x
                cicd.pipeline.run.url: ""
            - name: backend-2
              repoURL: https://github.com/acme/backend-2.git
              branch: main
            - name: front
              repoURL: https://github.com/acme/front.git
              branch: main
              host: front-feature-pricing.127.0.0.1.nip.io
          EOF
          )
          # shellcheck disable=SC2016
          got=$(echo "$out" | yq -N 'select(.kind == "Application") | .metadata.name as $app | .spec.source.helm.parameters[] | select(.name == "app.ingress.host") | $app + " " + .value')
          want='feature-pricing-backend-1 backend-1-feature-pricing.127.0.0.1.nip.io
          feature-pricing-front front-feature-pricing.127.0.0.1.nip.io'
          if [ "$got" != "$want" ]; then
            echo "::error::unexpected app.ingress.host parameters"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          got=$(echo "$out" | yq -N 'select(.kind == "Application") | .metadata.name + "=" + .metadata.annotations["preview.badil.dev/host"]')
          want='feature-pricing-backend-1=backend-1-feature-pricing.127.0.0.1.nip.io
          feature-pricing-backend-2=
          feature-pricing-front=front-feature-pricing.127.0.0.1.nip.io'
          if [ "$got" != "$want" ]; then
            echo "::error::unexpected preview.badil.dev/host annotations"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      # The revision comes from each entry (commitSha, else branch).
      - name: Render preview-env with serviceCharts overrides
        run: |
          out=$(helm template preview-x charts/preview-env -f - <<'EOF'
          apiVersion: badil.dev/v1
          services:
            - name: api
              repoURL: https://github.com/acme/api.git
              branch: master
              host: api-x.example.com
            - name: front
              repoURL: https://github.com/acme/front.git
              branch: release
              commitSha: abc123
              metadata:
                pr-author: octocat
                pr-url: https://github.com/acme/front/pull/42
                pr-number: "42"
                created-at: "2026-05-26T10:00:00Z"
                updated-at: "2026-05-26T10:00:00Z"
                vcs.ref.name: feature/x
                cicd.pipeline.run.url: ""
            - name: worker
              repoURL: https://github.com/acme/api.git
              branch: main
          serviceCharts:
            api:
              path: deploy/helm
              imageTagParam: image.tag
              hostParam: ingress.hostname
              valueFiles: [values-preview.yaml]
          EOF
          )
          got=$(echo "$out" | yq -N 'select(.kind == "Application") | .metadata.name + " " + .spec.source.repoURL + " " + .spec.source.targetRevision + " " + .spec.source.path + " " + (.spec.source.helm.valueFiles // "absent" | to_json(0)) + " " + ([.spec.source.helm.parameters[] | .name + "=" + .value] | join(","))')
          # shellcheck disable=SC2016
          want='preview-x-api https://github.com/acme/api.git master deploy/helm ["values-preview.yaml"] image.tag=$ARGOCD_APP_REVISION,ingress.hostname=api-x.example.com
          preview-x-front https://github.com/acme/front.git abc123 k8s/ "absent" app.image.tag=abc123
          preview-x-worker https://github.com/acme/api.git main k8s/ "absent" app.image.tag=$ARGOCD_APP_REVISION'
          if [ "$got" != "$want" ]; then
            echo "::error::serviceCharts overrides do not render as expected"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          got=$(echo "$out" | yq -N 'select(.kind == "AppProject") | .spec.sourceRepos[]')
          want='https://github.com/acme/api.git
          https://github.com/acme/front.git'
          if [ "$got" != "$want" ]; then
            echo "::error::expected the AppProject sourceRepos to be the distinct repoURLs of services, in file order"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render preview-env Argo CD namespace
        run: |
          ns() {
            helm template preview-x charts/preview-env -f charts/preview-env/ci/test-values.yaml "$@" \
              | yq -N '.kind + " " + (.metadata.namespace // "-") + " " + ((.spec.destination.namespace // .spec.destinations[0].namespace) // "-")'
          }
          got=$(ns)
          want='Namespace - -
          AppProject argocd preview-x
          Application argocd preview-x'
          if [ "$got" != "$want" ]; then
            echo '::error::expected the AppProject and Applications in namespace argocd by default'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          got=$(ns --set argocdNamespace=gitops)
          want='Namespace - -
          AppProject gitops preview-x
          Application gitops preview-x'
          if [ "$got" != "$want" ]; then
            echo '::error::expected the AppProject and Applications in namespace gitops with argocdNamespace=gitops'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          if out=$(helm template preview-x charts/preview-env -f charts/preview-env/ci/test-values.yaml --set argocdNamespace= 2>&1); then
            echo '::error::expected render to fail with an empty argocdNamespace'
            exit 1
          fi
          want="at '/argocdNamespace': '' does not match pattern '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\$'"
          if ! echo "$out" | grep -qF "$want"; then
            echo "::error::expected \"$want\" with an empty argocdNamespace"
            printf 'got: %s\n' "$out"
            exit 1
          fi
          if out=$(printf 'argocdNamespace: null\n' | helm template preview-x charts/preview-env -f charts/preview-env/ci/test-values.yaml -f - 2>&1); then
            echo '::error::expected render to fail with a null argocdNamespace'
            exit 1
          fi
          want="at '': missing property 'argocdNamespace'"
          if ! echo "$out" | grep -qF "$want"; then
            echo "::error::expected \"$want\" with a null argocdNamespace"
            printf 'got: %s\n' "$out"
            exit 1
          fi
          got=$(helm template preview-x charts/preview-env -f charts/preview-env/ci/test-values.yaml --set-string argocdNamespace=0123 \
            | grep -E '^kind: |^  namespace: ')
          want='kind: Namespace
          kind: AppProject
            namespace: "0123"
          kind: Application
            namespace: "0123"'
          if [ "$got" != "$want" ]; then
            echo '::error::expected namespace "0123" quoted on the AppProject and Applications with argocdNamespace=0123'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render preview-env Namespace metadata
        run: |
          meta() {
            helm template preview-x charts/preview-env -f charts/preview-env/ci/test-values.yaml -f - \
              | yq -N 'select(.kind == "Namespace") | .metadata | ([.labels | to_entries[] | "label " + .key + "=" + .value] + [.annotations | to_entries[] | "annotation " + .key + "=" + .value]) | .[]'
          }
          got=$(meta < /dev/null)
          want='label app.kubernetes.io/name=preview-x
          label app.kubernetes.io/instance=preview-x
          label app.kubernetes.io/part-of=preview-environments
          label app.kubernetes.io/managed-by=argocd
          annotation argocd.argoproj.io/sync-wave=-2'
          if [ "$got" != "$want" ]; then
            echo '::error::expected only the chart labels and sync-wave annotation on the Namespace without previewNamespace'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          got=$(meta <<'EOF'
          previewNamespace:
            labels:
              pod-security.kubernetes.io/enforce: baseline
              team: payments
            annotations:
              owner: platform
          EOF
          )
          want='label app.kubernetes.io/name=preview-x
          label app.kubernetes.io/instance=preview-x
          label app.kubernetes.io/part-of=preview-environments
          label app.kubernetes.io/managed-by=argocd
          label pod-security.kubernetes.io/enforce=baseline
          label team=payments
          annotation argocd.argoproj.io/sync-wave=-2
          annotation owner=platform'
          if [ "$got" != "$want" ]; then
            echo '::error::expected the previewNamespace labels and annotations after the chart ones'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render preview-env with invalid previewNamespace fails
        run: |
          while IFS='|' read -r bad msg; do
            if out=$(helm template preview-x charts/preview-env -f charts/preview-env/ci/test-values.yaml -f - 2>&1 <<EOF
          previewNamespace:
            $bad
          EOF
            ); then
              echo "::error::expected render to fail with previewNamespace $bad"
              exit 1
            fi
            if ! echo "$out" | grep -qF "$msg"; then
              echo "::error::expected \"$msg\" with previewNamespace $bad"
              printf 'got: %s\n' "$out"
              exit 1
            fi
          done <<'CASES'
          labels: {app.kubernetes.io/part-of: x}|at '/previewNamespace/labels/app.kubernetes.io~1part-of': false schema
          annotations: {argocd.argoproj.io/sync-wave: "0"}|at '/previewNamespace/annotations/argocd.argoproj.io~1sync-wave': false schema
          labels: {enabled: yes}|at '/previewNamespace/labels/enabled': got boolean, want string
          annotations: {owner: [a]}|at '/previewNamespace/annotations/owner': got array, want string
          labels: [a]|at '/previewNamespace/labels': got array, want object
          CASES

      - name: Kyverno preview guardrails example
        run: |
          got=$(yq -N '[.apiVersion, .kind] | join(" ")' examples/kyverno/preview-guardrails.yaml)
          if [ "$got" != 'policies.kyverno.io/v1 GeneratingPolicy' ]; then
            echo '::error::expected examples/kyverno/preview-guardrails.yaml to be one policies.kyverno.io/v1 GeneratingPolicy'
            printf 'got:\n%s\n' "$got"
            exit 1
          fi

      - name: Render badil with all components
        run: helm template t charts/badil -f charts/badil/ci/test-values.yaml --set ingress.enabled=true,ingress.host=badil.example.com,cleanup.enabled=true,metrics.serviceMonitor.enabled=true,dashboard.enabled=true

      - name: Render badil cleanup TTL
        run: |
          # Prints "CronJob:" then its CLEANUP_TTL as "<tag> <value>"; nothing without a CronJob.
          ttl_env() {
            helm template t charts/badil -f charts/badil/ci/test-values.yaml --set "cleanup.enabled=true$1" \
              | yq -N 'select(.kind == "CronJob") | .kind + ":" + ([.spec.jobTemplate.spec.template.spec.containers[0].env[] | select(.name == "CLEANUP_TTL") | .value | tag + " " + .] | join(","))'
          }
          got=$(ttl_env ,cleanup.ttl=168h)
          if [ "$got" != 'CronJob:!!str 168h' ]; then
            echo '::error::expected CLEANUP_TTL "168h" on the cleanup CronJob when cleanup.ttl is set'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(ttl_env "")
          if [ "$got" != 'CronJob:' ]; then
            echo '::error::expected no CLEANUP_TTL on the cleanup CronJob when cleanup.ttl is unset'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil cleanup interval and ServiceMonitor
        run: |
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml --set cleanup.interval=1h \
            | yq -N 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "CLEANUP_INTERVAL") | .value | tag + " " + .')
          if [ "$got" != '!!str 1h' ]; then
            echo '::error::expected CLEANUP_INTERVAL "1h" on the Deployment when cleanup.interval is set'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml \
            --set metrics.serviceMonitor.enabled=true,metrics.serviceMonitor.labels.release=kps \
            | yq -N 'select(.kind == "ServiceMonitor") | .metadata.labels.release')
          if [ "$got" != 'kps' ]; then
            echo '::error::expected a ServiceMonitor labelled release=kps when metrics.serviceMonitor is enabled'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil dashboard ConfigMap
        run: |
          cm=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml --set dashboard.enabled=true \
            | yq -N 'select(.kind == "ConfigMap" and .metadata.name == "t-dashboard")')
          got=$(echo "$cm" | yq -N '.metadata.labels.grafana_dashboard')
          if [ "$got" != '1' ]; then
            echo '::error::expected the dashboard ConfigMap labelled grafana_dashboard="1"'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(echo "$cm" | yq -N '.data["badil.json"]' | jq -r '.uid + " " + (.panels | length | tostring)')
          if [ "$got" != 'badil 10' ]; then
            echo '::error::expected badil.json to parse with uid "badil" and 10 panels'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil optional Argo CD webhook token
        run: |
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml \
            | yq -N 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "ARGOCD_WEBHOOK_TOKEN") | .valueFrom.secretKeyRef | .name + " " + .key + " " + (.optional | to_string)')
          if [ "$got" != 'badil argocd-webhook-token true' ]; then
            echo '::error::expected ARGOCD_WEBHOOK_TOKEN from optional key argocd-webhook-token of Secret badil on the Deployment'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil with numeric github ids
        run: |
          out=$(helm template t charts/badil -f - <<'EOF'
          config:
            githubAppId: 1234567
            githubInstallationId: 87654321
            gitopsRepo: example/gitops
          existingSecret: badil
          EOF
          )
          echo "$out" | grep -q 'value: "1234567"'
          echo "$out" | grep -q 'value: "87654321"'

      - name: Render preview-env with an invalid serviceCharts value fails
        run: |
          while IFS='|' read -r bad msg; do
            if out=$(helm template preview-x charts/preview-env -f charts/preview-env/ci/test-values.yaml -f - 2>&1 <<EOF
          serviceCharts:
            $bad
          EOF
            ); then
              echo "::error::expected render to fail with serviceCharts $bad"
              exit 1
            fi
            if ! echo "$out" | grep -qF "$msg"; then
              echo "::error::expected \"$msg\" with serviceCharts $bad"
              printf 'got: %s\n' "$out"
              exit 1
            fi
          done <<'CASES'
          backend-1: null|at '/serviceCharts/backend-1': got null, want object
          x: {path: 1}|at '/serviceCharts/x/path': got number, want string
          x: {branch: main}|at '/serviceCharts/x': additional properties 'branch' not allowed
          x: {imageTagParam: ""}|at '/serviceCharts/x/imageTagParam': minLength: got 0, want 1
          x: {valueFiles: [off]}|at '/serviceCharts/x/valueFiles/0': got boolean, want string
          x: {valueFiles: off}|at '/serviceCharts/x/valueFiles': got boolean, want array
          x: {repo: a}|at '/serviceCharts/x': additional properties 'repo' not allowed
          CASES

      - name: Render preview-env with an invalid preview file fails
        run: |
          fails() {
            if out=$(helm template preview-x charts/preview-env -f - 2>&1); then
              echo "::error::expected render to fail with \"$1\""
              exit 1
            fi
            if ! echo "$out" | grep -qF "$1"; then
              echo "::error::expected \"$1\""
              printf 'got: %s\n' "$out"
              exit 1
            fi
          }
          fails "at '': missing property 'apiVersion'" <<'EOF'
          services:
            - name: backend-1
              repoURL: https://github.com/acme/backend-1.git
              branch: main
          EOF
          fails "at '/apiVersion': value must be 'badil.dev/v1'" <<'EOF'
          apiVersion: badil.dev/v2
          services: []
          EOF
          fails "at '/services/0': additional properties 'image' not allowed" <<'EOF'
          apiVersion: badil.dev/v1
          services:
            - name: backend-1
              repoURL: https://github.com/acme/backend-1.git
              branch: main
              image: x
          EOF
          fails "at '/services/0': missing property 'repoURL'" <<'EOF'
          apiVersion: badil.dev/v1
          services:
            - name: backend-1
              branch: main
          EOF
          fails "at '/services/0': properties 'metadata' required, if 'commitSha' exists" <<'EOF'
          apiVersion: badil.dev/v1
          services:
            - name: backend-1
              repoURL: https://github.com/acme/backend-1.git
              branch: main
              commitSha: abc123
          EOF

      - name: Render badil without required values fails
        run: |
          if out=$(helm template t charts/badil 2>&1); then
            echo "::error::expected render to fail without required values"
            exit 1
          fi
          echo "$out" | grep -q 'existingSecret is required'

      # Evaluates the triggers of the GitHub deployments example against the
      # Application fixtures in examples/argocd/testdata/notifications, each
      # annotated with the result it expects from each trigger.
      - name: Argo CD GitHub deployments triggers
        run: |
          tmp=$(mktemp -d)
          yq '{"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": "argocd-notifications-cm"}, "data": (.notifications.triggers * .notifications.templates)}' \
            examples/argocd/github-deployments-values.yaml > "$tmp/cm.yaml"
          # One condition per trigger: oncePer is tracked per condition, so a
          # split trigger could post the same state twice for one SHA.
          multi=$(yq '.data | to_entries[] | select(.key | test("^trigger\.")) | select((.value | from_yaml | length) != 1) | .key' "$tmp/cm.yaml")
          if [ -n "$multi" ]; then
            echo "::error::triggers with more than one condition: $multi"
            exit 1
          fi
          # trigger run reads local files but still needs a kubeconfig.
          printf '%s\n' 'apiVersion: v1' 'kind: Config' \
            'clusters: [{name: c, cluster: {server: "https://127.0.0.1:1"}}]' \
            'users: [{name: u, user: {token: x}}]' \
            'contexts: [{name: c, context: {cluster: c, user: u, namespace: argocd}}]' \
            'current-context: c' > "$tmp/kubeconfig"
          mkdir "$tmp/apps"
          cp examples/argocd/testdata/notifications/*.yaml "$tmp/apps/"
          # The image runs as user argocd: let it read the runner's mktemp dir.
          chmod -R a+rX "$tmp"
          triggers='on-preview-degraded on-preview-sync-error'
          want=$(for f in "$tmp"/apps/*.yaml; do
            for t in $triggers; do
              echo "$(basename "$f" .yaml) $t $(yq ".metadata.annotations[\"test.badil.dev/$t\"]" "$f")"
            done
          done)
          # shellcheck disable=SC2016
          got=$(docker run --rm -e KUBECONFIG=/w/kubeconfig -e TRIGGERS="$triggers" -v "$tmp":/w -w /w \
            quay.io/argoproj/argocd:v3.6.1 bash -c '
              shopt -s nullglob
              files=(apps/*.yaml)
              [ "${#files[@]}" -gt 0 ] || { echo "no fixture readable in apps/" >&2; exit 1; }
              for f in "${files[@]}"; do
                for t in $TRIGGERS; do
                  r=$(argocd admin notifications trigger run "$t" "./$f" --config-map ./cm.yaml --secret :empty 2>/dev/null | awk "NR > 1 { print \$NF }" | tail -n 1)
                  echo "$(basename "$f" .yaml) $t $r"
                done
              done')
          if [ "$got" != "$want" ]; then
            echo "::error::trigger results differ from the fixtures' test.badil.dev annotations"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
