name: Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "examples/**"
      - "internal/preview/testdata/**"
      - "testdata/contract/**"
      - "schema/**"
      - "ct.yaml"
      - ".github/workflows/charts.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: helm lint
        run: for c in charts/*/; do helm lint "$c" -f "$c/ci/test-values.yaml"; done

      - name: ct lint (all charts)
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/helmpack/chart-testing:v3.15.0 \
            sh -c 'git config --global --add safe.directory /w && ct lint --config ct.yaml --all'

      - name: ct lint (version bump on changed charts)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/helmpack/chart-testing:v3.15.0 \
            sh -c 'git config --global --add safe.directory /w && ct lint --config ct.yaml --excluded-charts badil'

      - name: Render app with envFrom and initContainers
        run: |
          deploy=$(helm template backend-1 charts/app -f charts/app/ci/test-values.yaml | yq -N 'select(.kind == "Deployment")')
          got=$(echo "$deploy" | yq -N '.spec.template.spec.initContainers[] | select(.name == "acme-init") | .image')
          if [ "$got" != 'ghcr.io/acme/backend-1:latest' ]; then
            echo '::error::expected init container acme-init to render image ghcr.io/acme/backend-1:latest through tpl'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(echo "$deploy" | yq -N '.spec.template.spec.containers[0].envFrom[0].secretRef.name')
          if [ "$got" != 'acme-db' ]; then
            echo '::error::expected envFrom[0].secretRef.name "acme-db" on the main container'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(echo "$deploy" | yq -N '[.spec.template.spec.initContainers[] | select(.name == "pg-setup" or .name == "migrate")] | length')
          if [ "$got" != '0' ]; then
            echo '::error::expected no pg-setup or migrate init containers'
            exit 1
          fi

      - name: Render preview-apps with badil values
        run: |
          out=$(helm template preview-x charts/preview-apps -f internal/preview/testdata/values.golden.yaml)
          echo "$out" | grep -q 'preview.badil.dev/pr-url'

      - name: Render preview-apps with an unknown root key fails
        run: |
          if out=$(printf 'serviceRepos:\n  backend-1: https://github.com/acme/backend-1.git\n' \
            | helm template preview-x charts/preview-apps -f - -f internal/preview/testdata/values.golden.yaml 2>&1); then
            echo '::error::expected render to fail with serviceRepos at the root'
            exit 1
          fi
          want="at '': additional properties 'serviceRepos' not allowed"
          if ! echo "$out" | grep -qF "$want"; then
            echo "::error::expected \"$want\" with serviceRepos at the root"
            printf 'got: %s\n' "$out"
            exit 1
          fi

      - name: Render preview-apps with YAML 1.1 ambiguous metadata
        run: |
          out=$(helm template preview-x charts/preview-apps -f - <<'EOF'
          apiVersion: badil.dev/v1beta1
          gitopsRepoURL: https://github.com/acme/gitops.git
          services:
            - name: backend-1
              repoURL: https://github.com/acme/backend-1.git
              branch: main
              commitSha: abc123
              imageTag: abc123
              chart: {path: k8s/, imageTagParam: app.image.tag, hostParam: app.ingress.host}
              metadata:
                pr-author: "Y"
                pr-url: https://github.com/acme/backend-1/pull/42
                pr-number: "0x1F"
                created-at: "2026-05-26"
                updated-at: "2026-05-26T10:00:00Z"
                vcs.ref.name: "on"
                cicd.pipeline.run.url: https://github.com/acme/backend-1/actions/runs/1
          dependencies: []
          EOF
          )
          got=$(echo "$out" | yq -N 'select(.kind == "Application") | .metadata.annotations | (.["preview.badil.dev/pr-author"], .["preview.badil.dev/pr-number"], .["preview.badil.dev/created-at"], .["preview.badil.dev/vcs.ref.name"])')
          want='Y
          0x1F
          2026-05-26
          on'
          if [ "$got" != "$want" ]; then
            echo "::error::metadata annotations do not match the original strings"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render preview-apps Argo CD namespace
        run: |
          ns() {
            helm template preview-x charts/preview-apps -f charts/preview-apps/ci/test-values.yaml "$@" \
              | yq -N '.kind + " " + (.metadata.namespace // "-") + " " + ((.spec.destination.namespace // .spec.destinations[0].namespace) // "-")'
          }
          got=$(ns)
          want='Namespace - -
          AppProject argocd preview-x
          Application argocd preview-x'
          if [ "$got" != "$want" ]; then
            echo '::error::expected the AppProject and Applications in namespace argocd by default'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          got=$(ns --set argocdNamespace=gitops)
          want='Namespace - -
          AppProject gitops preview-x
          Application gitops preview-x'
          if [ "$got" != "$want" ]; then
            echo '::error::expected the AppProject and Applications in namespace gitops with argocdNamespace=gitops'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          if out=$(helm template preview-x charts/preview-apps -f charts/preview-apps/ci/test-values.yaml --set argocdNamespace= 2>&1); then
            echo '::error::expected render to fail with an empty argocdNamespace'
            exit 1
          fi
          want="at '/argocdNamespace': '' does not match pattern '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\$'"
          if ! echo "$out" | grep -qF "$want"; then
            echo "::error::expected \"$want\" with an empty argocdNamespace"
            printf 'got: %s\n' "$out"
            exit 1
          fi
          if out=$(printf 'argocdNamespace: null\n' | helm template preview-x charts/preview-apps -f charts/preview-apps/ci/test-values.yaml -f - 2>&1); then
            echo '::error::expected render to fail with a null argocdNamespace'
            exit 1
          fi
          want="at '': missing property 'argocdNamespace'"
          if ! echo "$out" | grep -qF "$want"; then
            echo "::error::expected \"$want\" with a null argocdNamespace"
            printf 'got: %s\n' "$out"
            exit 1
          fi
          got=$(helm template preview-x charts/preview-apps -f charts/preview-apps/ci/test-values.yaml --set-string argocdNamespace=0123 \
            | grep -E '^kind: |^  namespace: ')
          want='kind: Namespace
          kind: AppProject
            namespace: "0123"
          kind: Application
            namespace: "0123"'
          if [ "$got" != "$want" ]; then
            echo '::error::expected namespace "0123" quoted on the AppProject and Applications with argocdNamespace=0123'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render preview-apps Namespace metadata
        run: |
          meta() {
            helm template preview-x charts/preview-apps -f charts/preview-apps/ci/test-values.yaml -f - \
              | yq -N 'select(.kind == "Namespace") | .metadata | ([.labels | to_entries[] | "label " + .key + "=" + .value] + [.annotations | to_entries[] | "annotation " + .key + "=" + .value]) | .[]'
          }
          got=$(meta < /dev/null)
          want='label app.kubernetes.io/name=preview-x
          label app.kubernetes.io/instance=preview-x
          label app.kubernetes.io/managed-by=argocd
          label badil.dev/preview=preview-x
          annotation argocd.argoproj.io/sync-wave=-2'
          if [ "$got" != "$want" ]; then
            echo '::error::expected only the chart labels and sync-wave annotation on the Namespace without namespace'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          got=$(meta <<'EOF'
          namespace:
            labels:
              pod-security.kubernetes.io/enforce: baseline
              team: payments
            annotations:
              owner: platform
          EOF
          )
          want='label app.kubernetes.io/name=preview-x
          label app.kubernetes.io/instance=preview-x
          label app.kubernetes.io/managed-by=argocd
          label badil.dev/preview=preview-x
          label pod-security.kubernetes.io/enforce=baseline
          label team=payments
          annotation argocd.argoproj.io/sync-wave=-2
          annotation owner=platform'
          if [ "$got" != "$want" ]; then
            echo '::error::expected the namespace labels and annotations after the chart ones'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render preview-apps with invalid namespace metadata fails
        run: |
          while IFS='|' read -r bad msg; do
            if out=$(helm template preview-x charts/preview-apps -f charts/preview-apps/ci/test-values.yaml -f - 2>&1 <<EOF
          namespace:
            $bad
          EOF
            ); then
              echo "::error::expected render to fail with namespace $bad"
              exit 1
            fi
            if ! echo "$out" | grep -qF "$msg"; then
              echo "::error::expected \"$msg\" with namespace $bad"
              printf 'got: %s\n' "$out"
              exit 1
            fi
          done <<'CASES'
          annotations: {argocd.argoproj.io/sync-wave: "0"}|at '/namespace/annotations/argocd.argoproj.io~1sync-wave': false schema
          labels: {enabled: yes}|at '/namespace/labels/enabled': got boolean, want string
          annotations: {owner: [a]}|at '/namespace/annotations/owner': got array, want string
          labels: [a]|at '/namespace/labels': got array, want object
          CASES

      - name: Kyverno preview guardrails example
        run: |
          got=$(yq -N '[.apiVersion, .kind] | join(" ")' examples/kyverno/preview-guardrails.yaml)
          if [ "$got" != 'policies.kyverno.io/v1 GeneratingPolicy' ]; then
            echo '::error::expected examples/kyverno/preview-guardrails.yaml to be one policies.kyverno.io/v1 GeneratingPolicy'
            printf 'got:\n%s\n' "$got"
            exit 1
          fi

      - name: Kyverno preview secrets example
        run: |
          got=$(yq -N '[.apiVersion, .kind] | join(" ")' examples/kyverno/preview-secrets.yaml)
          want=$(printf '%s\n%s' 'rbac.authorization.k8s.io/v1 ClusterRole' 'policies.kyverno.io/v1 GeneratingPolicy')
          if [ "$got" != "$want" ]; then
            echo '::error::expected examples/kyverno/preview-secrets.yaml to be a rbac.authorization.k8s.io/v1 ClusterRole then a policies.kyverno.io/v1 GeneratingPolicy'
            printf 'got:\n%s\n' "$got"
            exit 1
          fi

      - name: Render badil with all components
        run: helm template t charts/badil -f charts/badil/ci/test-values.yaml --set ingress.enabled=true,ingress.host=badil.example.com,metrics.serviceMonitor.enabled=true,dashboard.enabled=true

      - name: Render badil ingress paths
        run: |
          # GitHub runs this step with bash -e and no pipefail: without it a failed helm template would print nothing.
          set -o pipefail
          # Prints each Ingress path as "<path> <pathType> <service port name>".
          paths() {
            helm template t charts/badil -f charts/badil/ci/test-values.yaml --set "ingress.enabled=true,ingress.host=badil.example.com$1" \
              | yq -N 'select(.kind == "Ingress") | .spec.rules[].http.paths[] | .path + " " + .pathType + " " + .backend.service.port.name'
          }
          got=$(paths "")
          if [ "$got" != '/webhooks/github Exact http' ]; then
            echo '::error::expected the Ingress to route only /webhooks/github (Exact) to port http by default'
            printf 'got:\n%s\n' "$got"
            exit 1
          fi
          got=$(paths ,ingress.api=true)
          want='/webhooks/github Exact http
          /v1 Prefix http'
          if [ "$got" != "$want" ]; then
            echo '::error::expected the Ingress to route /webhooks/github (Exact) then /v1 (Prefix) to port http with ingress.api=true'
            printf 'got:\n%s\n' "$got"
            exit 1
          fi

      - name: Render badil sweep TTL
        run: |
          # GitHub runs this step with bash -e and no pipefail: without it a failed helm template would print nothing.
          set -o pipefail
          # Prints "Deployment:" then the badil container's CLEANUP_INTERVAL and CLEANUP_TTL as "<name>=<tag> <value>".
          sweep_env() {
            helm template t charts/badil -f charts/badil/ci/test-values.yaml "$@" \
              | yq -N 'select(.kind == "Deployment") | .kind + ":" + ([.spec.template.spec.containers[] | select(.name == "badil") | .env[] | select(.name == "CLEANUP_INTERVAL" or .name == "CLEANUP_TTL") | .name + "=" + (.value | tag) + " " + .value] | join(","))'
          }
          got=$(sweep_env --set cleanup.ttl=168h)
          if [ "$got" != 'Deployment:CLEANUP_INTERVAL=!!str 1h,CLEANUP_TTL=!!str 168h' ]; then
            echo '::error::expected CLEANUP_INTERVAL "1h" and CLEANUP_TTL "168h" on the Deployment when cleanup.ttl is set'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(sweep_env)
          if [ "$got" != 'Deployment:CLEANUP_INTERVAL=!!str 1h' ]; then
            echo '::error::expected no CLEANUP_TTL on the Deployment when cleanup.ttl is unset'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil namespace ClusterRole
        run: |
          # Prints the ClusterRole's rules, then the ClusterRoleBinding's role and subjects.
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml --namespace badil \
            | yq -N '(select(.kind == "ClusterRole") | .metadata.name + " " + (.rules | to_json(0))), (select(.kind == "ClusterRoleBinding") | .roleRef.name + " " + (.subjects | to_json(0)))')
          want='t-namespaces [{"apiGroups":[""],"resources":["namespaces"],"verbs":["get"]}]
          t-namespaces [{"kind":"ServiceAccount","name":"t","namespace":"badil"}]'
          if [ "$got" != "$want" ]; then
            echo '::error::expected a ClusterRole with only get on namespaces, bound to the badil ServiceAccount'
            printf 'got:\n%s\n' "$got"
            exit 1
          fi

      - name: Namespace guard example
        run: |
          got=$(yq -N '[.apiVersion, .kind, .metadata.name] | join(" ")' examples/namespace-guard/namespace-guard.yaml)
          want='admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy badil-namespace-guard
          admissionregistration.k8s.io/v1 ValidatingAdmissionPolicyBinding badil-namespace-guard'
          if [ "$got" != "$want" ]; then
            echo '::error::expected examples/namespace-guard/namespace-guard.yaml to be a ValidatingAdmissionPolicy then a ValidatingAdmissionPolicyBinding, both admissionregistration.k8s.io/v1 and named badil-namespace-guard'
            printf 'got:\n%s\n' "$got"
            exit 1
          fi
          # Prints each admission object as "<kind> <name>", followed for the policy by its failure policy and rules,
          # its match condition and its validation, and for the binding by its policy name and actions.
          got=$(yq -N 'select(.kind == "ValidatingAdmissionPolicy*") | .kind + " " + .metadata.name,
            (select(.kind == "ValidatingAdmissionPolicy") | (.spec.failurePolicy + " " + (.spec.matchConstraints.resourceRules | to_json(0))),
              (.spec.matchConditions[] | .name + ": " + .expression),
              (.spec.validations[] | .expression + " -> " + .message)),
            (select(.kind == "ValidatingAdmissionPolicyBinding") | .spec.policyName + " " + (.spec.validationActions | to_json(0)))' \
            examples/namespace-guard/namespace-guard.yaml)
          want=$(printf '%s\n' \
            'ValidatingAdmissionPolicy badil-namespace-guard' \
            'Fail [{"apiGroups":[""],"apiVersions":["v1"],"resources":["namespaces"],"operations":["UPDATE","DELETE"]}]' \
            'preview-renderer: request.userInfo.username == "system:serviceaccount:argocd:argocd-application-controller"' \
            "oldObject.metadata.?labels[?'badil.dev/preview'].hasValue() -> namespace is not a badil preview" \
            'ValidatingAdmissionPolicyBinding badil-namespace-guard' \
            'badil-namespace-guard ["Deny"]')
          if [ "$got" != "$want" ]; then
            echo '::error::expected the namespace guard policy to refuse renderer updates and deletes of unlabelled namespaces, and its binding to deny'
            printf 'got:\n%s\n' "$got"
            exit 1
          fi

      - name: Render badil sweep interval and ServiceMonitor
        run: |
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml \
            | yq -N 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "CLEANUP_INTERVAL") | .value | tag + " " + .')
          if [ "$got" != '!!str 1h' ]; then
            echo '::error::expected CLEANUP_INTERVAL "1h" on the Deployment by default'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml \
            --set metrics.serviceMonitor.enabled=true,metrics.serviceMonitor.labels.release=kps \
            | yq -N 'select(.kind == "ServiceMonitor") | .metadata.labels.release')
          if [ "$got" != 'kps' ]; then
            echo '::error::expected a ServiceMonitor labelled release=kps when metrics.serviceMonitor is enabled'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil dashboard ConfigMap
        run: |
          cm=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml --set dashboard.enabled=true \
            | yq -N 'select(.kind == "ConfigMap" and .metadata.name == "t-dashboard")')
          got=$(echo "$cm" | yq -N '.metadata.labels.grafana_dashboard')
          if [ "$got" != '1' ]; then
            echo '::error::expected the dashboard ConfigMap labelled grafana_dashboard="1"'
            printf 'got: %s\n' "$got"
            exit 1
          fi
          got=$(echo "$cm" | yq -N '.data["badil.json"]' | jq -r '.uid + " " + (.panels | length | tostring)')
          if [ "$got" != 'badil 10' ]; then
            echo '::error::expected badil.json to parse with uid "badil" and 10 panels'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil optional status token
        run: |
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml \
            | yq -N 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "BADIL_STATUS_TOKEN") | .valueFrom.secretKeyRef | .name + " " + .key + " " + (.optional | to_string)')
          if [ "$got" != 'badil status-token true' ]; then
            echo '::error::expected BADIL_STATUS_TOKEN from optional key status-token of Secret badil on the Deployment'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil optional deploy token
        run: |
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml \
            | yq -N 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "BADIL_DEPLOY_TOKEN") | .valueFrom.secretKeyRef | .name + " " + .key + " " + (.optional | to_string)')
          if [ "$got" != 'badil deploy-token true' ]; then
            echo '::error::expected BADIL_DEPLOY_TOKEN from optional key deploy-token of Secret badil on the Deployment'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil optional read token
        run: |
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml \
            | yq -N 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "BADIL_READ_TOKEN") | .valueFrom.secretKeyRef | .name + " " + .key + " " + (.optional | to_string)')
          if [ "$got" != 'badil read-token true' ]; then
            echo '::error::expected BADIL_READ_TOKEN from optional key read-token of Secret badil on the Deployment'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil required gitops repo token
        run: |
          ref='select(.name == "GITOPS_REPO_TOKEN") | .valueFrom.secretKeyRef | .name + " " + .key + " optional:" + (has("optional") | to_string)'
          got=$(helm template t charts/badil -f charts/badil/ci/test-values.yaml \
            | yq -N "select(.kind == \"Deployment\") | .spec.template.spec.containers[0].env[] | $ref")
          if [ "$got" != 'badil gitops-repo-token optional:false' ]; then
            echo '::error::expected GITOPS_REPO_TOKEN from required key gitops-repo-token of Secret badil on the Deployment'
            printf 'got: %s\n' "$got"
            exit 1
          fi

      - name: Render badil gitops commit identity and signing key
        run: |
          # Prints "<kind>:" then GITOPS_COMMIT_NAME and GITOPS_COMMIT_EMAIL as "<name>=<value>" and the Secret key of
          # GITOPS_SIGNING_KEY as "<secret> <key> optional:<optional>", for the Deployment.
          commit_env() {
            vars='[.[] | select(.name == "GITOPS_COMMIT_NAME" or .name == "GITOPS_COMMIT_EMAIL") | .name + "=" + .value] | join(",")'
            key='[.[] | select(.name == "GITOPS_SIGNING_KEY") | .valueFrom.secretKeyRef | .name + " " + .key + " optional:" + (.optional | to_string)] | join(",")'
            helm template t charts/badil -f charts/badil/ci/test-values.yaml "$@" \
              | yq -N "select(.kind == \"Deployment\") | .kind + \":\" + (.spec.template.spec.containers[0].env | $vars) + \";\" + (.spec.template.spec.containers[0].env | $key)"
          }
          got=$(commit_env)
          want='Deployment:;badil gitops-signing-key optional:true'
          if [ "$got" != "$want" ]; then
            echo '::error::expected no GITOPS_COMMIT_NAME or GITOPS_COMMIT_EMAIL by default, and GITOPS_SIGNING_KEY from optional key gitops-signing-key of Secret badil, on the Deployment'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          got=$(commit_env --set config.gitopsCommitName=badil-gitops,config.gitopsCommitEmail=badil-gitops@users.noreply.github.com)
          want='Deployment:GITOPS_COMMIT_NAME=badil-gitops,GITOPS_COMMIT_EMAIL=badil-gitops@users.noreply.github.com;badil gitops-signing-key optional:true'
          if [ "$got" != "$want" ]; then
            echo '::error::expected GITOPS_COMMIT_NAME and GITOPS_COMMIT_EMAIL on the Deployment when config.gitopsCommitName and config.gitopsCommitEmail are set'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render badil GitHub host
        run: |
          # Prints "<kind>:" then GITHUB_URL and GITHUB_API_URL as "<name>=<value>", for the Deployment.
          host_env() {
            vars='[.[] | select(.name == "GITHUB_URL" or .name == "GITHUB_API_URL") | .name + "=" + .value] | join(",")'
            helm template t charts/badil -f charts/badil/ci/test-values.yaml "$@" \
              | yq -N "select(.kind == \"Deployment\") | .kind + \":\" + (.spec.template.spec.containers[0].env | $vars)"
          }
          got=$(host_env)
          want='Deployment:'
          if [ "$got" != "$want" ]; then
            echo '::error::expected no GITHUB_URL or GITHUB_API_URL on the Deployment by default'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          got=$(host_env --set config.githubURL=https://ghe.example.com,config.githubAPIURL=https://ghe.example.com/api/v3/)
          want='Deployment:GITHUB_URL=https://ghe.example.com,GITHUB_API_URL=https://ghe.example.com/api/v3/'
          if [ "$got" != "$want" ]; then
            echo '::error::expected GITHUB_URL and GITHUB_API_URL on the Deployment when config.githubURL and config.githubAPIURL are set'
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi

      - name: Render badil with numeric github ids
        run: |
          out=$(helm template t charts/badil -f - <<'EOF'
          config:
            githubAppId: 1234567
            githubInstallationId: 87654321
            gitopsRepoURL: https://github.com/example/gitops.git
          existingSecret: badil
          EOF
          )
          echo "$out" | grep -q 'value: "1234567"'
          echo "$out" | grep -q 'value: "87654321"'

      - name: Render preview-apps with invalid chart settings or image tag fails
        run: |
          while IFS='|' read -r bad msg; do
            if out=$(helm template preview-x charts/preview-apps -f - 2>&1 <<EOF
          apiVersion: badil.dev/v1beta1
          gitopsRepoURL: https://github.com/acme/gitops.git
          services:
            - {name: backend-1, repoURL: https://github.com/acme/backend-1.git, branch: main, $bad}
          dependencies: []
          EOF
            ); then
              echo "::error::expected render to fail with $bad"
              exit 1
            fi
            if ! echo "$out" | grep -qF "$msg"; then
              echo "::error::expected \"$msg\" with $bad"
              printf 'got: %s\n' "$out"
              exit 1
            fi
          done <<'CASES'
          imageTag: x, chart: null|at '/services/0/chart': got null, want object
          imageTag: x, chart: {path: 1, imageTagParam: a, hostParam: b}|at '/services/0/chart/path': got number, want string
          imageTag: x, chart: {path: k8s/, imageTagParam: a, hostParam: b, branch: main}|at '/services/0/chart': additional properties 'branch' not allowed
          imageTag: x, chart: {path: k8s/, imageTagParam: "", hostParam: b}|at '/services/0/chart/imageTagParam': minLength: got 0, want 1
          imageTag: x, chart: {path: k8s/, imageTagParam: a}|at '/services/0/chart': missing property 'hostParam'
          imageTag: x, chart: {path: k8s/, imageTagParam: a, hostParam: b, valueFiles: [off]}|at '/services/0/chart/valueFiles/0': got boolean, want string
          imageTag: x, chart: {path: k8s/, imageTagParam: a, hostParam: b, valueFiles: off}|at '/services/0/chart/valueFiles': got boolean, want array
          imageTag: x, chart: {path: k8s/, imageTagParam: a, hostParam: b, valueFiles: []}|at '/services/0/chart/valueFiles': minItems: got 0, want 1
          imageTag: "", chart: {path: k8s/, imageTagParam: a, hostParam: b}|at '/services/0/imageTag': minLength: got 0, want 1
          imageTag: 1234567, chart: {path: k8s/, imageTagParam: a, hostParam: b}|at '/services/0/imageTag': got number, want string
          CASES

      - name: Render the valid contract fixtures to their goldens
        run: |
          for f in testdata/contract/v1beta1/valid/*.yaml; do
            n=$(basename "$f" .yaml)
            golden="testdata/contract/v1beta1/preview-apps/$n.golden.yaml"
            if ! out=$(helm template "$n" charts/preview-apps -f "$f"); then
              echo "::error::preview-apps failed to render $f"
              exit 1
            fi
            if ! echo "$out" | diff -u "$golden" -; then
              echo "::error::preview-apps output differs from $golden: regenerate with make contract-golden"
              exit 1
            fi
          done

      - name: Render the invalid contract fixtures fails
        run: |
          for f in testdata/contract/v1beta1/invalid/*.yaml; do
            want=$(sed -n 's/^# want: //p' "$f")
            if [ -z "$want" ]; then
              echo "::error::$f has no '# want: ' line"
              exit 1
            fi
            if out=$(helm template "$(basename "$f" .yaml)" charts/preview-apps -f "$f" 2>&1); then
              echo "::error::expected render of $f to fail"
              exit 1
            fi
            if ! echo "$out" | grep -qF "$want"; then
              echo "::error::expected \"$want\" rendering $f"
              printf 'got: %s\n' "$out"
              exit 1
            fi
          done

      - name: Render badil without required values fails
        run: |
          if out=$(helm template t charts/badil 2>&1); then
            echo "::error::expected render to fail without required values"
            exit 1
          fi
          echo "$out" | grep -q 'existingSecret is required'

      # Evaluates the triggers of the GitHub deployments and status examples
      # against the Application fixtures in
      # examples/argocd/testdata/notifications, each annotated with the result
      # it expects from each trigger, and renders badil-status for the
      # fixtures a status trigger fires on.
      - name: Argo CD GitHub deployments triggers
        run: |
          tmp=$(mktemp -d)
          # Both files' triggers and templates: they share no key.
          # shellcheck disable=SC2016
          yq ea '{"apiVersion": "v1", "kind": "ConfigMap", "metadata": {"name": "argocd-notifications-cm"}, "data": (.notifications.triggers * .notifications.templates)} as $item ireduce ({}; . * $item)' \
            examples/argocd/notifications-values.yaml examples/argocd/github-deployments-values.yaml > "$tmp/cm.yaml"
          # One condition per trigger: oncePer is tracked per condition, so a
          # split trigger could post the same state twice for one SHA.
          multi=$(yq '.data | to_entries[] | select(.key | test("^trigger\.")) | select((.value | from_yaml | length) != 1) | .key' "$tmp/cm.yaml")
          if [ -n "$multi" ]; then
            echo "::error::triggers with more than one condition: $multi"
            exit 1
          fi
          # trigger run reads local files but still needs a kubeconfig.
          printf '%s\n' 'apiVersion: v1' 'kind: Config' \
            'clusters: [{name: c, cluster: {server: "https://127.0.0.1:1"}}]' \
            'users: [{name: u, user: {token: x}}]' \
            'contexts: [{name: c, context: {cluster: c, user: u, namespace: argocd}}]' \
            'current-context: c' > "$tmp/kubeconfig"
          mkdir "$tmp/apps"
          cp examples/argocd/testdata/notifications/*.yaml "$tmp/apps/"
          # The image runs as user argocd: let it read the runner's mktemp dir.
          chmod -R a+rX "$tmp"
          triggers='on-preview-deployed on-preview-degraded on-preview-sync-error on-preview-unpinned on-status-progressing on-status-ready on-status-degraded on-status-sync-failed'
          want=$(for f in "$tmp"/apps/*.yaml; do
            for t in $triggers; do
              echo "$(basename "$f" .yaml) $t $(yq ".metadata.annotations[\"test.badil.dev/$t\"]" "$f")"
            done
          done)
          # shellcheck disable=SC2016
          got=$(docker run --rm -e KUBECONFIG=/w/kubeconfig -e TRIGGERS="$triggers" -v "$tmp":/w -w /w \
            quay.io/argoproj/argocd:v3.6.1 bash -c '
              shopt -s nullglob
              files=(apps/*.yaml)
              [ "${#files[@]}" -gt 0 ] || { echo "no fixture readable in apps/" >&2; exit 1; }
              for f in "${files[@]}"; do
                for t in $TRIGGERS; do
                  out=$(argocd admin notifications trigger run "$t" "./$f" --config-map ./cm.yaml --secret :empty 2>/tmp/stderr)
                  if grep -F "failed to execute when condition" /tmp/stderr >&2; then
                    echo "$(basename "$f" .yaml) $t: when condition failed" >&2
                    exit 1
                  fi
                  # oncePer runs only when when is true; on error the engine
                  # logs it and drops oncePer instead of failing.
                  if grep -F "failed to execute oncePer condition" /tmp/stderr >&2; then
                    echo "$(basename "$f" .yaml) $t: oncePer condition failed" >&2
                    exit 1
                  fi
                  r=$(echo "$out" | awk "NR > 1 { print \$NF }" | tail -n 1)
                  echo "$(basename "$f" .yaml) $t $r"
                done
              done')
          if [ "$got" != "$want" ]; then
            echo "::error::trigger results differ from the fixtures' test.badil.dev annotations"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
          # A fixture on which a status trigger fires carries the status and
          # revision badil-status must send; the others carry neither.
          status_fixtures=''
          for f in "$tmp"/apps/*.yaml; do
            n=$(basename "$f" .yaml)
            fires=$(yq '[.metadata.annotations | to_entries[] | select(.key | test("^test\.badil\.dev/on-status-")) | select(.value == "true")] | length' "$f")
            annotated=$(yq '[.metadata.annotations | keys[] | select(. == "test.badil.dev/status" or . == "test.badil.dev/revision")] | length' "$f")
            if [ "$fires" -gt 0 ] && [ "$annotated" != 2 ]; then
              echo "::error::$n fires a status trigger but lacks test.badil.dev/status or test.badil.dev/revision"
              exit 1
            fi
            if [ "$fires" -eq 0 ] && [ "$annotated" != 0 ]; then
              echo "::error::$n fires no status trigger but has test.badil.dev/status or test.badil.dev/revision"
              exit 1
            fi
            if [ "$fires" -gt 0 ]; then
              status_fixtures="$status_fixtures $n"
            fi
          done
          mkdir "$tmp/out"
          chmod a+rwX "$tmp/out"
          # shellcheck disable=SC2016
          docker run --rm -e KUBECONFIG=/w/kubeconfig -e FIXTURES="$status_fixtures" -v "$tmp":/w -w /w \
            quay.io/argoproj/argocd:v3.6.1 bash -c '
              for n in $FIXTURES; do
                argocd admin notifications template notify badil-status "./apps/$n.yaml" \
                  --config-map ./cm.yaml --secret :empty > "out/$n.yaml" || exit 1
              done'
          want=''
          got=''
          for n in $status_fixtures; do
            f="$tmp/apps/$n.yaml"
            want="$want$n $(yq '.metadata.annotations["test.badil.dev/status"] + " " + .metadata.annotations["test.badil.dev/revision"]' "$f")
          "
            got="$got$n $(yq '.webhook.badil.body' "$tmp/out/$n.yaml" | jq -r '.status + " " + .revision')
          "
          done
          if [ "$got" != "$want" ]; then
            echo "::error::badil-status bodies differ from the fixtures' test.badil.dev/status and test.badil.dev/revision"
            printf 'got:\n%s\nwant:\n%s\n' "$got" "$want"
            exit 1
          fi
