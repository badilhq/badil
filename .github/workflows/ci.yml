name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift in:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      - name: Gitops repo template
        run: |
          make template
          for f in README.md badil.yaml previews/.gitkeep argocd/appproject-previews.yaml argocd/applicationset-previews.yaml; do
            if [ ! -f "dist/template/$f" ]; then
              echo "::error::dist/template/$f is missing"
              exit 1
            fi
          done
          if grep -rn 'badilhq/demo-gitops' dist/template; then
            echo "::error::dist/template references badilhq/demo-gitops"
            exit 1
          fi
          for f in appproject-previews.yaml applicationset-previews.yaml; do
            if ! grep -qF 'https://github.com/YOUR-ORG/YOUR-GITOPS-REPO.git' "dist/template/argocd/$f"; then
              echo "::error::dist/template/argocd/$f lacks the gitops repo placeholder"
              exit 1
            fi
          done

      - name: JSON schemas up to date
        run: |
          go generate ./cmd/schemagen
          for f in charts/preview-apps/values.schema.json schema/preview.v1beta1.schema.json; do
            if [ -n "$(git status --porcelain -- "$f")" ]; then
              echo "::error::$f is out of date: run make schema"
              git diff -- "$f"
              exit 1
            fi
          done

      - run: go test -race -count=1 ./...
