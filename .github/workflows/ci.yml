name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift in:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      - name: JSON schemas up to date
        run: |
          go generate ./cmd/schemagen
          for f in charts/preview-env/values.schema.json schema/preview.v1beta1.schema.json; do
            if [ -n "$(git status --porcelain -- "$f")" ]; then
              echo "::error::$f is out of date: run make schema"
              git diff -- "$f"
              exit 1
            fi
          done

      - run: go test -race -count=1 ./...
