name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift in:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      - name: values.schema.json up to date
        run: |
          go generate ./cmd/schemagen
          if ! git diff --exit-code charts/preview-env/values.schema.json; then
            echo '::error::values.schema.json is out of date: run make schema'
            exit 1
          fi

      - run: go test -race -count=1 ./...
