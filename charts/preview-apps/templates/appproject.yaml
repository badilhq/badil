{{- $repos := list }}
{{- range .Values.services }}
{{- $repos = append $repos .repoURL }}
{{- end }}
{{- range .Values.dependencies }}
{{- $repos = append $repos .chart.repoURL }}
{{- if .valueFiles }}
{{- $repos = append $repos $.Values.gitopsRepoURL }}
{{- end }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.argocdNamespace | quote }}
  labels:
    {{- include "preview-apps.labels" (dict "name" .Release.Name "instance" .Release.Name) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  {{- include "preview-apps.finalizers" . | nindent 2 }}
spec:
  description: "Preview environment: {{ .Release.Name }}"
  sourceRepos:
    {{- range uniq $repos }}
    - {{ . | quote }}
    {{- end }}
  destinations:
    - namespace: {{ .Release.Name }}
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
