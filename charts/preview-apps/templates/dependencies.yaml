{{- range .Values.dependencies }}
{{- $src := include "preview-apps.dependencySource" . }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Values.argocdNamespace | quote }}
  labels:
    {{- include "preview-apps.labels" (dict "name" .name "instance" $.Release.Name) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    preview.badil.dev/vcs.ref.revision: ""
    preview.badil.dev/host: {{ .host | default "" | quote }}
  {{- include "preview-apps.finalizers" . | nindent 2 }}
spec:
  project: {{ $.Release.Name }}
  {{- if .valueFiles }}
  sources:
    - {{ $src | indent 6 | trim }}
    - repoURL: {{ $.Values.gitopsRepoURL | quote }}
      targetRevision: HEAD
      ref: values
  {{- else }}
  source:
    {{- $src | nindent 4 }}
  {{- end }}
  {{- include "preview-apps.applicationSync" $.Release.Name | nindent 2 }}
---
{{- end }}

{{- /*
The chart source of a dependency: an OCI chart reference (path ".") or a
chart of a Helm repository (chart), at its version. Its valueFiles are read
from the gitops repo through the source of ref "values".
*/}}
{{- define "preview-apps.dependencySource" -}}
repoURL: {{ .chart.repoURL | quote }}
targetRevision: {{ .chart.version | quote }}
{{- if .chart.name }}
chart: {{ .chart.name | quote }}
{{- else }}
path: "."
{{- end }}
helm:
  releaseName: {{ .name }}
  {{- with .valueFiles }}
  valueFiles:
    {{- range . }}
    - {{ printf "$values/%s" . | quote }}
    {{- end }}
  {{- end }}
  {{- with .values }}
  valuesObject:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .host }}
  parameters:
    - name: {{ .hostParam | quote }}
      value: {{ .host | quote }}
  {{- end }}
{{- end }}
