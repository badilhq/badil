{{- if .Values.cleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "badil.fullname" . }}-cleanup
  labels:
    {{- include "badil.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # One attempt per run: the next scheduled run is the retry, and a failed
      # pod is kept for its logs.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: cleanup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "badil.fullname" . }}
          # The catch-up reads the namespace of a new preview (clusterrole.yaml),
          # and the sweep and the catch-up read and write the badil-expired
          # ConfigMap (role.yaml).
          automountServiceAccountToken: true
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "badil.podSecurityContext" . | nindent 12 }}
          containers:
            - name: cleanup
              image: {{ include "badil.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["cleanup"]
              env:
                {{- include "badil.env" . | nindent 16 }}
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                {{- with .Values.cleanup.ttl }}
                - name: CLEANUP_TTL
                  value: {{ . | quote }}
                {{- end }}
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                {{- include "badil.containerSecurityContext" . | nindent 16 }}
              volumeMounts:
                - name: gitops
                  mountPath: /var/lib/badil
          volumes:
            - name: gitops
              emptyDir: {}
{{- end }}
