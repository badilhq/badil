{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "badil.fullname" . }}-dashboard
  labels:
    {{- include "badil.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  badil.json: |-
    {{- .Files.Get "dashboards/badil.json" | nindent 4 }}
{{- end }}
