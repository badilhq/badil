# Before creating a preview, badil reads the namespace named after its slug,
# and refuses the preview when that namespace exists and is not a preview
# namespace: Argo CD would adopt it, and teardown would delete it. It only gets
# namespaces by name: no list, watch or write.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "badil.fullname" . }}-namespaces
  labels:
    {{- include "badil.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "badil.fullname" . }}-namespaces
  labels:
    {{- include "badil.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "badil.fullname" . }}-namespaces
subjects:
  - kind: ServiceAccount
    name: {{ include "badil.fullname" . }}
    namespace: {{ .Release.Namespace }}
