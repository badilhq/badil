# The server keeps each preview's status in a ConfigMap of its own namespace
# (badil-status-<slug>): it reads, writes and deletes only ConfigMaps here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "badil.fullname" . }}
  labels:
    {{- include "badil.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "badil.fullname" . }}
  labels:
    {{- include "badil.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "badil.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "badil.fullname" . }}
    namespace: {{ .Release.Namespace }}
