apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "badil.fullname" . }}
  labels:
    {{- include "badil.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "badil.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "badil.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "badil.fullname" . }}
      # The server reads and writes its status ConfigMaps (role.yaml); the
      # ServiceAccount itself mounts no token, so the CronJob gets none.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "badil.podSecurityContext" . | nindent 8 }}
      containers:
        - name: badil
          image: {{ include "badil.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "badil.env" . | nindent 12 }}
            - name: BADIL_STATUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: status-token
                  optional: true
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_ADDR
              value: {{ ternary (printf ":%v" .Values.metrics.port) "" .Values.metrics.enabled | quote }}
            {{- if not .Values.cleanup.enabled }}
            {{- with .Values.cleanup.interval }}
            - name: CLEANUP_INTERVAL
              value: {{ . | quote }}
            {{- with $.Values.cleanup.ttl }}
            - name: CLEANUP_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          # serve clones the gitops repo before it listens: allow 5 minutes
          # for the clone before the liveness probe takes over.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "badil.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: gitops
              mountPath: /var/lib/badil
      volumes:
        - name: gitops
          emptyDir: {}
