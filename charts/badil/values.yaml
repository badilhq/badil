# Number of server replicas. Keep 1: reconciles are serialized within one
# replica, and the one-PR-per-service check of a preview relies on it.
replicaCount: 1

# Container image; an empty tag defaults to .Chart.AppVersion.
image:
  repository: ghcr.io/badilhq/badil
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets for a private registry.
imagePullSecrets: []

# Server configuration; githubAppId, githubInstallationId and gitopsRepoURL
# are required, gitopsRepoUsername, githubURL and githubAPIURL are optional.
config:
  # GitHub App ID (GITHUB_APP_ID).
  githubAppId: ""
  # GitHub App installation ID (GITHUB_INSTALLATION_ID).
  githubInstallationId: ""
  # Gitops repository's http(s) clone URL, e.g.
  # https://github.com/<owner>/<repo>.git (GITOPS_REPO_URL).
  gitopsRepoURL: ""
  # Basic-auth username of the Secret key gitops-repo-token
  # (GITOPS_REPO_USERNAME); empty uses x-access-token.
  gitopsRepoUsername: ""
  # Web base of the GitHub host (GITHUB_URL), e.g. https://ghe.example.com:
  # the host of the service repos' URLs and PR URLs. Empty uses
  # https://github.com.
  githubURL: ""
  # API base of the GitHub host (GITHUB_API_URL), e.g.
  # https://ghe.example.com/api/v3/; api/v3/ is appended to a base whose path
  # does not end with it and whose host neither starts with "api." nor
  # contains ".api.". Empty uses https://api.github.com/.
  githubAPIURL: ""

# Required: existing Secret with keys github-private-key, github-webhook-secret and gitops-repo-token.
# Key gitops-repo-token authenticates badil's git calls to the gitops repo (GITOPS_REPO_TOKEN): a token with Contents
# write on the gitops repo, on GitHub a machine user's.
# Optional key deploy-token enables POST /v1/deploy and POST /v1/sync (BADIL_DEPLOY_TOKEN).
# Optional key read-token enables the GET /v1 routes (BADIL_READ_TOKEN); deploy-token grants them too.
# Optional key status-token enables POST /webhooks/status (BADIL_STATUS_TOKEN).
existingSecret: ""

# Port the server listens on and the Service exposes.
service:
  port: 8080

# Ingress routing POST /webhooks/github (the URL GitHub calls) to the server port, and /v1 when api is true (for CI
# jobs, agents and the CLI outside the cluster). /healthz and /webhooks/status are never routed: Argo CD reaches the
# status webhook through the Service. host is required when enabled.
ingress:
  enabled: false
  className: ""
  host: ""
  tls: []
  # Also route /v1 (deploy, sync, previews, wait).
  api: false

# Container resource requests and limits.
resources: {}

# Prometheus metrics, served on their own port: the Ingress does not expose
# them.
metrics:
  # Serve GET /metrics on port (METRICS_ADDR); false disables the listener.
  enabled: true
  port: 9090
  # Prometheus Operator ServiceMonitor, rendered only when metrics are enabled.
  serviceMonitor:
    enabled: false
    # Extra labels, e.g. release: <kube-prometheus-stack release> to match its
    # serviceMonitorSelector.
    labels: {}
    # Scrape interval, e.g. 30s; empty uses Prometheus' default.
    interval: ""

# Grafana dashboard as a ConfigMap, loaded by the Grafana sidecar
# (kube-prometheus-stack default) through its labels.
dashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

# Cleanup sweep: deletes stale previews and rewrites every kept preview to
# match badil.yaml. It runs in the server every cleanup.interval (with
# metrics) by default; cleanup.enabled=true moves it to a CronJob (no
# metrics) and turns the in-server sweep off.
cleanup:
  # Run the sweep as a CronJob on schedule instead of in the server.
  enabled: false
  schedule: "0 * * * *"
  # Run the sweep in the server every interval (CLEANUP_INTERVAL), as a Go
  # duration of at least 1m; empty disables it. Ignored when enabled is true.
  interval: "1h"
  # Delete previews with no deploy for this long (CLEANUP_TTL), as a Go
  # duration such as 168h; empty disables the TTL.
  ttl: ""

# Admission policy that refuses any update or delete of a namespace by the
# ServiceAccount of the renderer that deploys previews unless the namespace
# already carries the preview label badil.dev/preview. It applies whoever wrote
# the preview file. The renderer must manage no namespace other than previews:
# its updates and deletes of any other namespace are refused too.
# Renders a cluster-scoped ValidatingAdmissionPolicy and its binding; needs
# Kubernetes 1.30+.
namespaceGuard:
  enabled: false
  # Namespace and ServiceAccount of the renderer; the policy only matches
  # requests from that identity. The default is Argo CD's application
  # controller.
  renderer:
    namespace: argocd
    serviceAccount: argocd-application-controller
