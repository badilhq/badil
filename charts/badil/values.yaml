# Number of server replicas. Keep 1: reconciles are serialized within one
# replica, and the one-PR-per-service check of a preview relies on it.
replicaCount: 1

# Container image; an empty tag defaults to .Chart.AppVersion.
image:
  repository: ghcr.io/badilhq/badil
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets for a private registry.
imagePullSecrets: []

# Server configuration; all three values are required.
config:
  # GitHub App ID (GITHUB_APP_ID).
  githubAppId: ""
  # GitHub App installation ID (GITHUB_INSTALLATION_ID).
  githubInstallationId: ""
  # Gitops repository as owner/name (GITOPS_REPO).
  gitopsRepo: ""

# Required: existing Secret with keys github-private-key and github-webhook-secret.
# Optional key deploy-token enables POST /v1/deploy and POST /v1/sync (BADIL_DEPLOY_TOKEN).
# Optional key status-token enables POST /webhooks/status (BADIL_STATUS_TOKEN).
existingSecret: ""

# Port the server listens on and the Service exposes.
service:
  port: 8080

# Ingress routing every path of the host to the server port (/webhooks/github, /webhooks/status, /v1/deploy, /healthz); host is required when enabled.
ingress:
  enabled: false
  className: ""
  host: ""
  tls: []

# Container resource requests and limits.
resources: {}

# Prometheus metrics, served on their own port: the Ingress does not expose
# them.
metrics:
  # Serve GET /metrics on port (METRICS_ADDR); false disables the listener.
  enabled: true
  port: 9090
  # Prometheus Operator ServiceMonitor, rendered only when metrics are enabled.
  serviceMonitor:
    enabled: false
    # Extra labels, e.g. release: <kube-prometheus-stack release> to match its
    # serviceMonitorSelector.
    labels: {}
    # Scrape interval, e.g. 30s; empty uses Prometheus' default.
    interval: ""

# Grafana dashboard as a ConfigMap, loaded by the Grafana sidecar
# (kube-prometheus-stack default) through its labels.
dashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

# Cleanup sweep: deletes stale previews and rewrites every kept preview to
# match badil.yaml. It runs in the server every cleanup.interval (with
# metrics) by default; cleanup.enabled=true moves it to a CronJob (no
# metrics) and turns the in-server sweep off.
cleanup:
  # Run the sweep as a CronJob on schedule instead of in the server.
  enabled: false
  schedule: "0 * * * *"
  # Run the sweep in the server every interval (CLEANUP_INTERVAL), as a Go
  # duration of at least 1m; empty disables it. Ignored when enabled is true.
  interval: "1h"
  # Delete previews with no deploy for this long (CLEANUP_TTL), as a Go
  # duration such as 168h; empty disables the TTL.
  ttl: ""
