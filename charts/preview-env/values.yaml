# Input contract: values.schema.json validates the merged values on every
# render. apiVersion and services come from the preview file badil writes at
# previews/<slug>/values.yaml; serviceCharts and previewNamespace from the
# gitops repo's preview-env.yaml. Any other root key (such as serviceRepos or
# preview, which badil reads from badil.yaml) fails rendering, as does
# serviceCharts.<name>.branch. A null serviceCharts entry or field, a null
# previewNamespace, labels or annotations, and a null field of a services
# entry are rejected. A null serviceCharts falls back to its default ({}); a
# null argocdNamespace is rejected as missing.

# argocdNamespace: the namespace Argo CD runs in. The AppProject and every
# service Application are created there. Must be a Kubernetes namespace name.
argocdNamespace: argocd

# apiVersion: required, badil.dev/v1beta1. There is no default: a preview file
# without it (written by an older badil) fails rendering.
#
# services: one entry per service of the preview, in catalog order. Unknown
# fields are rejected.
#
# apiVersion: badil.dev/v1beta1
# services:
#   - name: backend-1                                    # required
#     repoURL: https://github.com/acme/backend-1.git     # required: the service's git URL, the Application source and an AppProject sourceRepo
#     branch: main                                       # required: targetRevision when not pinned
#     commitSha: "abc123"         # optional — pinned to commit SHA (used as targetRevision and the image tag); requires metadata
#     host: "backend-1-feature-pricing.example.com"   # optional, written by badil for exposed services; becomes the host parameter (default app.ingress.host)
#     metadata:                    # optional — present exactly when commitSha is; every key required
#       pr-author: "octocat"
#       pr-url: "https://github.com/badilhq/demo-backend-1/pull/42"
#       pr-number: "42"
#       created-at: "2026-02-18T14:30:00Z"
#       updated-at: "2026-02-18T16:00:00Z"
#       vcs.ref.name: "feature/add-pricing"
#       cicd.pipeline.run.url: "https://github.com/badilhq/demo-backend-1/actions/runs/12345"
#   - name: backend-2              # no commitSha → tracks its branch at $ARGOCD_APP_REVISION, no metadata
#     repoURL: https://github.com/acme/backend-2.git
#     branch: main

services: []

# serviceCharts: optional per-service chart settings, read from the gitops
# repo's preview-env.yaml. Every key is optional; a service without an entry uses
# every default. A null entry or a null field is rejected; omit the entry or
# the field to use the defaults. String values must be non-empty strings:
# quote YAML 1.1 booleans such as yes, no, on, off.
#
# serviceCharts:
#   backend-1:
#     path: deploy/helm           # default "k8s/": chart path in the service repo
#     imageTagParam: image.tag    # default "app.image.tag": Helm parameter set to the image tag
#     hostParam: ingress.hostname # default "app.ingress.host": Helm parameter set to the preview host
#     valueFiles:                 # default none: extra values files, applied in order
#       - values-preview.yaml
#
# Argo CD resolves each valueFiles entry: a relative path is joined to the
# chart path, a path starting with "/" is joined to the service repo root, and a
# URL with a scheme is fetched remotely (or rejected when the scheme is not
# allowed). A path resolving outside the repo root, or to the root itself, is
# rejected, and $<ref>/ paths are not supported. A missing file fails the sync.
#
# hostParam is passed as a Helm --set, so a list-indexed name such as
# ingress.hosts[0].host replaces the chart's default list: the full list (with
# its paths) and ingress.enabled: true must then come from a file in valueFiles.
serviceCharts: {}

# previewNamespace: optional extra metadata for the preview Namespace, read
# from the gitops repo's preview-env.yaml. A null previewNamespace, labels or
# annotations is rejected; omit it instead. Values must be strings: quote
# YAML 1.1 booleans such as yes, no, on, off. Quote such keys too: Helm reads
# an unquoted key y or n as true or false. A label the chart already sets
# (app.kubernetes.io/name, app.kubernetes.io/instance,
# app.kubernetes.io/part-of, app.kubernetes.io/managed-by) or the annotation
# argocd.argoproj.io/sync-wave fails rendering.
#
# previewNamespace:
#   labels: {}        # extra Namespace labels, string values
#   annotations: {}   # extra Namespace annotations, string values

# Ingress hosts come from each service entry's host, written by badil from
# the preview block of the gitops repo's badil.yaml, and are passed as the
# Helm parameter app.ingress.host (or the service's serviceCharts hostParam).
# An entry without host gets no ingress host.
# The preview block is badil's input, in badil.yaml; this chart does not read
# it and rejects it in its values:
#
# preview:
#   domain: 127.0.0.1.nip.io      # lowercase bare domain, parent of every preview host
#   tls: false                    # optional, default true; only picks https/http in badil's PR-comment links
#   expose:                       # services that get a host; others get none
#     front: {}                   # entry value: empty, {} or {path: ...}
#     backend-1:
#       path: /docs               # optional, default "/"; only used in badil's PR-comment links
