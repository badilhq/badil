{{- range .Values.services }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Values.argocdNamespace | quote }}
  labels:
    {{- include "preview-env.labels" (dict "name" .name "instance" $.Release.Name) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    preview.badil.dev/vcs.ref.revision: {{ .commitSha | default "" | quote }}
    preview.badil.dev/host: {{ .host | default "" | quote }}
    {{- if .metadata }}
    preview.badil.dev/pr-author: {{ index .metadata "pr-author" | quote }}
    preview.badil.dev/pr-url: {{ index .metadata "pr-url" | quote }}
    preview.badil.dev/pr-number: {{ index .metadata "pr-number" | quote }}
    preview.badil.dev/created-at: {{ index .metadata "created-at" | quote }}
    preview.badil.dev/updated-at: {{ index .metadata "updated-at" | quote }}
    preview.badil.dev/vcs.ref.name: {{ index .metadata "vcs.ref.name" | quote }}
    preview.badil.dev/cicd.pipeline.run.url: {{ index .metadata "cicd.pipeline.run.url" | quote }}
    {{- end }}
  {{- include "preview-env.finalizers" . | nindent 2 }}
spec:
  project: {{ $.Release.Name }}
  source:
    repoURL: {{ .repoURL | quote }}
    targetRevision: {{ if .commitSha }}{{ .commitSha | quote }}{{ else }}{{ .branch | quote }}{{ end }}
    path: {{ .chart.path | quote }}
    helm:
      releaseName: {{ .name }}
      {{- with .chart.valueFiles }}
      valueFiles:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      parameters:
        - name: {{ .chart.imageTagParam | quote }}
          value: {{ .imageTag | quote }}
          forceString: true
        {{- if .host }}
        - name: {{ .chart.hostParam | quote }}
          value: {{ .host | quote }}
        {{- end }}
  {{- include "preview-env.applicationSync" $.Release.Name | nindent 2 }}
---
{{- end }}
