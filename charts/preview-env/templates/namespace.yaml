{{- $pn := .Values.previewNamespace }}
{{- if not (or (kindIs "invalid" $pn) (kindIs "map" $pn)) }}
{{- fail (printf "previewNamespace must be a map, got %v" $pn) }}
{{- end }}
{{- $pn = $pn | default dict }}
{{- $reserved := dict "labels" (list "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/part-of" "app.kubernetes.io/managed-by") "annotations" (list "argocd.argoproj.io/sync-wave") }}
{{- range $field := list "labels" "annotations" }}
{{- $m := index $pn $field }}
{{- if not (or (kindIs "invalid" $m) (kindIs "map" $m)) }}
{{- fail (printf "previewNamespace.%s must be a map, got %v" $field $m) }}
{{- end }}
{{- range $k, $v := ($m | default dict) }}
{{- if has $k (index $reserved $field) }}
{{- fail (printf "previewNamespace.%s.%s is set by the chart" $field $k) }}
{{- end }}
{{- if not (kindIs "string" $v) }}
{{- fail (printf "previewNamespace.%s.%s must be a string (quote YAML 1.1 booleans such as yes, no, on, off), got %v" $field $k $v) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: preview-environments
    app.kubernetes.io/managed-by: argocd
    {{- range $k, $v := ($pn.labels | default dict) }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- range $k, $v := ($pn.annotations | default dict) }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
