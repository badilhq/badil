{{- $pn := .Values.namespace | default dict }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "preview-env.labels" (dict "name" .Release.Name "instance" .Release.Name) | nindent 4 }}
    {{- range $k, $v := ($pn.labels | default dict) }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- range $k, $v := ($pn.annotations | default dict) }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
