{{- $pn := .Values.namespace | default dict }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: preview-environments
    app.kubernetes.io/managed-by: argocd
    {{- range $k, $v := ($pn.labels | default dict) }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- range $k, $v := ($pn.annotations | default dict) }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
