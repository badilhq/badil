{{- $repos := list }}
{{- range .Values.services }}
{{- $repos = append $repos .repoURL }}
{{- end }}
{{- range .Values.dependencies }}
{{- $repos = append $repos .chart.repoURL }}
{{- if .valueFiles }}
{{- $repos = append $repos $.Values.gitopsRepoURL }}
{{- end }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.argocdNamespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: preview-environments
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Preview environment: {{ .Release.Name }}"
  sourceRepos:
    {{- range uniq $repos }}
    - {{ . | quote }}
    {{- end }}
  destinations:
    - namespace: {{ .Release.Name }}
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
