{{- $ns := .Values.argocdNamespace }}
{{- if not (and (kindIs "string" $ns) $ns) }}
{{- fail (printf "argocdNamespace must be a non-empty string, got %v" $ns) }}
{{- end }}
{{- /* metadata.namespace renders unquoted: reject strings YAML reads back as another value (0123, true, null, yes). */}}
{{- $parsed := get (fromYaml (printf "v: %s" $ns)) "v" }}
{{- if not (and (kindIs "string" $parsed) (eq $parsed $ns)) }}
{{- fail (printf "argocdNamespace must not read as a YAML number, boolean or null (such as 0123, true, yes), got %v" $ns) }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Release.Name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: preview-environments
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Preview environment: {{ .Release.Name }}"
  sourceRepos:
    {{- range $.Values.serviceRepos }}
    - {{ . | quote }}
    {{- end }}
  destinations:
    - namespace: {{ .Release.Name }}
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
