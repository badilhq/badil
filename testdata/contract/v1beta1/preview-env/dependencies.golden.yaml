# Source: preview-env/templates/dependencies.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dependencies-postgres
  namespace: "argocd"
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: dependencies
    app.kubernetes.io/part-of: preview-environments
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    preview.badil.dev/vcs.ref.revision: ""
    preview.badil.dev/host: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dependencies
  sources:
    - repoURL: "oci://registry-1.docker.io/bitnamicharts/postgresql"
      targetRevision: "16.4.2"
      path: "."
      helm:
        releaseName: postgres
        valueFiles:
          - "$values/deps/postgres.yaml"
        valuesObject:
          auth:
            password: preview
          primary:
            persistence:
              enabled: false
    - repoURL: "https://github.com/acme/gitops.git"
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dependencies
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

