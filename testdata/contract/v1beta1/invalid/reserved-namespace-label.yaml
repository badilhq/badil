# want: at '/namespace/labels/app.kubernetes.io~1part-of': false schema
apiVersion: badil.dev/v1beta1
gitopsRepoURL: https://github.com/acme/gitops.git
namespace:
  labels:
    app.kubernetes.io/part-of: x
services:
  - name: api
    repoURL: https://github.com/acme/platform.git
    branch: main
    imageTag: ${ARGOCD_APP_REVISION}
    chart:
      path: k8s/
      imageTagParam: app.image.tag
      hostParam: app.ingress.host
dependencies: []
